[build-system]
requires = ["setuptools >= 68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "unpa"
version = "1.3"
description = "UNPA NetHound - Real-time terminal network analyzer"
readme = "README.md"
license = "MIT"
requires-python = ">=3.7"
authors = [{ name = "greenfan" }]
keywords = ["network", "analyzer", "packet-capture", "terminal"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
process = ["psutil"]

[project.urls]
Homepage = "https://github.com/greenfan/unpa"

[project.scripts]
unpa = "unpa:main"

[tool.setuptools]
py-modules = ["unpa"]
